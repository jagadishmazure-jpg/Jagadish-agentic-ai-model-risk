name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (offline, synthetic data, mock agents)
        run: pytest -q
      - name: Model risk gate (pillars, high-risk controls, scenario thresholds, lifecycle sign-offs)
        run: |
          mkdir -p evidence
          modelrisk gate
          modelrisk gate --json > evidence/gate-report.json
      - name: Doc outputs and code excerpts match a fresh run
        run: python scripts/render_docs.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gate-report, path: evidence/gate-report.json, if-no-files-found: ignore }
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI (pinned)
        run: |
          curl -sSLo bicep https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep && bicep --version
      - name: bicep build (linter runs as part of build; warnings fail the job)
        run: |
          bicep build infra/bicep/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          cat bicep.log
          if grep -q "Warning" bicep.log; then exit 1; fi
