[project]
name = "agentic-ai-model-risk"
version = "0.1.0"
description = "AI model risk management as code: model cards, data sheets, risk cards, plus scenario planning for five mock agentic AI systems, with inventory tiering, lifecycle gates, independent validation, monitoring, HITL sign-off and a CI gate. Offline, synthetic data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
dependencies = [
  "jsonschema==4.26.0", # validates every pillar artifact against schemas/
  "mcp==2.3.0",         # risk register exposed as an MCP server
  "pyyaml==6.0.3",      # pillar artifacts are YAML
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[project.scripts]
modelrisk = "modelrisk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelrisk"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
