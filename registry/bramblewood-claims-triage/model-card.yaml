id: bramblewood-claims-triage
name: Claims triage agent
version: 1.2.0
kind: domain
domain: insurance
company: Bramblewood Mutual
owner: Tomas Albright (Claims Operations Director)
developer: Claims AI team
purpose: >-
  Triage first notice of loss for auto and home claims: fast-track small, well-documented claims within
  a hard payout limit and route the rest to adjusters or special investigations.
intended_uses:
- Fast-track payment of documented auto and home claims up to 5,000
- Routing to an adjuster with a cited summary
- Proposing special-investigations referrals for a human to approve
out_of_scope_uses:
- Denying a claim
- Bodily injury, life or health claims
- Setting premiums or underwriting new policies
- Any use of location as a pricing or eligibility factor
system:
  type: agentic-llm
  framework: LangGraph-style state graph (offline mock runtime in modelrisk.agents.graph)
  base_models:
  - name: gpt-4o (mock)
    provider: Azure OpenAI in Foundry (mocked offline)
    role: evidence-cited rationale only; never sets the decision
  - name: bramblewood-claims-triage scorer
    provider: in-house logistic model
    role: scores the case; the decision comes from fixed thresholds
  tools:
  - get_policy
  - approve_payout (limit 5,000)
  - assign_adjuster
  - refer_siu (human approval)
  - request_documents
  autonomy: act
  fallback: Rules-only triage with every claim routed to an adjuster while the model is unavailable.
data_sheet: data-sheet.yaml
risk_cards: risk-cards.yaml
scenarios: scenarios.yaml
decision_impact:
  affects_individuals: true
  decision: fast-track payment or route to an adjuster
  reversible: true
  financial_exposure: medium
data_sensitivity:
- pii
- financial
users: 120
monthly_volume: 40000
metrics:
- name: accuracy
  value: 0.7773
  threshold: 0.72
  direction: higher-is-better
  dataset: synthetic reference set, seed 7, 3,000 cases
- name: recall
  value: 0.7176
  threshold: 0.65
  direction: higher-is-better
  dataset: synthetic reference set, seed 7, 3,000 cases
evaluation:
  methods:
  - seeded offline evaluation (modelrisk.evaluation)
  - scenario suite with controls on and off (modelrisk.scenarios)
  - independent re-performance on seed 11 (modelrisk.validation)
  adversarial:
  - attack: instruction injection in untrusted free text
    attempts: 200
    success_rate: 0.0
explainability: >-
  The rationale cites the payout-limit rule, document completeness, prior claims and photo consistency.
  Adjusters see the key factors.
fairness:
  protected_attributes:
  - region (urban or rural, used as a proxy check)
  metrics:
  - adverse impact ratio of fast-track outcomes, rural vs urban
  notes: The zip risk index correlates with rural addresses and is excluded from the model.
limitations:
- Synthetic claims only.
- 'No image model: photo consistency arrives as a precomputed score.'
- Shelf-policy fraud rings with very old policies are outside the training range.
environment:
  est_kwh_per_1k_requests: 0.4
  notes: >-
    Rough figure for a hosted model call plus scoring; used for comparison between versions, not reporting.
regulatory:
  frameworks:
  - nist-ai-rmf
  - eu-ai-act
  - iso-42001
  - state-insurance-ai
  - glba
  eu_ai_act_uses:
  - property-casualty-claims
monitoring:
  window: 500
  psi_warn: 0.1
  psi_alert: 0.25
  performance:
  - metric: accuracy
    min: 0.67
    warn: 0.72
  on_alert: Route every case to a human, open a revalidation item and notify the model owner.
